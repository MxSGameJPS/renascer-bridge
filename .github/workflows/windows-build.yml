name: Build Windows bridge

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: powershell
        run: npm install

      - name: Test code parser
        shell: powershell
        run: npm test

      - name: Build Windows executables
        shell: powershell
        run: npm run dist:win

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: renascer-bridge-windows
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 14
